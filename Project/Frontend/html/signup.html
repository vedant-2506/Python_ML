<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up · RankResume</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"></head><body><div class="auth-page"><section class="auth-brand"><a class="brand" href="login.html"><span class="brand-mark"><i class="bi bi-stars"></i></span>RankResume</a><h1>Build your<br>best team.</h1><p>Screen resumes faster, assess fairly, and make every hire count.</p><div class="auth-art"><i class="bi bi-people"></i></div></section><section class="auth-side"><div class="auth-card"><h2>Create Account</h2><p class="text-muted mb-4">Start building a smarter hiring pipeline.</p><form id="authForm" novalidate><div class="field"><label class="form-label">Full Name</label><input name="name" class="form-control" required placeholder="Your full name"></div><div class="field"><label class="form-label">Work Email</label><input name="email" type="email" class="form-control" required placeholder="you@company.com"></div><div class="field"><label class="form-label">Company Name</label><input name="company" class="form-control" required placeholder="Company name"></div><div class="field"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required minlength="8" placeholder="At least 8 characters"><div class="progress mt-2"><div id="strength" class="progress-bar"></div></div></div><button class="btn btn-primary w-100">Sign Up</button></form><p class="text-center mt-4 text-muted">Already have an account? <a href="login.html">Login</a></p></div></section></div><div class="toast-stack"></div><script src="../js/config.js"></script><script src="../js/mock-data.js"></script><script src="../js/ui.js"></script><script src="../js/auth.js"></script><script>Auth.bindAuthForm(document.querySelector('#authForm'),'signup');document.querySelector('[name=password]').oninput=e=>document.querySelector('#strength').style.width=Math.min(100,e.target.value.length*12.5)+'%'</script></body></html>
